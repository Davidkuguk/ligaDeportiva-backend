services:
  - type: web
    name: liga-mestre-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Liga Deportiva API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://liga-mestre-api.onrender.com
      - key: FRONTEND_URLS
        value: https://ligadeportivafront.netlify.app,https://liga-deportiva-front.onrender.com,http://localhost:4200,http://127.0.0.1:4200
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: liga-mestre-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: liga-mestre-db
    plan: free
