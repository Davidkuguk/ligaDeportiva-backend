name: Tests

# Este workflow se ejecuta automaticamente para comprobar que el backend
# sigue funcionando cuando se suben cambios al repositorio.
on:
  push:
    branches:
      - main
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Usamos PHP 8.3 para revisar el estilo del codigo.
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check coding style
        run: vendor/bin/pint --test

  tests:
    runs-on: ubuntu-latest
    # Estas variables obligan a Laravel a usar una base de datos SQLite
    # temporal para los tests. Asi no se toca la base de datos real.
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DATABASE_URL: ''
      DB_URL: ''

    strategy:
      fail-fast: true
      # Probamos varias versiones de PHP para detectar incompatibilidades.
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite es necesario para que RefreshDatabase funcione en CI.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Primero se ejecutan las pruebas unitarias: modelos, servicios y logica aislada.
      - name: Execute unit tests
        run: php artisan test --testsuite=Unit

      # Despues se ejecutan las Feature Tests: endpoints reales de la API.
      - name: Execute feature tests
        run: php artisan test --testsuite=Feature

  assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node se usa para compilar los assets gestionados por Vite.
          node-version: 22

      - name: Install NPM dependencies
        run: npm install

      - name: Build assets
        run: npm run build
